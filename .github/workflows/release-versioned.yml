name: Versioned prerelease

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable prerelease tag to validate and publish
        required: true
        type: string
      dry_run:
        description: Build and validate assets without creating a GitHub release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - id: commit
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          python3 scripts/validate-release-tag.py "$TAG"
          sha=$(git rev-parse HEAD)
          tag_sha=$(git rev-parse "$TAG^{commit}")
          test "$sha" = "$tag_sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            editors/tree-sitter/package-lock.json
            editors/vscode/package-lock.json
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      - run: just ci

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: just release-build "${{ matrix.target }}"
      - run: just release-vscode "${{ matrix.target }}" "${{ matrix.platform }}"
        shell: bash
      - run: just release-package "${{ matrix.target }}" "${{ matrix.platform }}" "${{ needs.validate.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          pattern: versioned-*
          path: dist
          merge-multiple: true
      - name: Validate immutable tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          SHA: ${{ needs.validate.outputs.sha }}
          DRY_RUN: ${{ env.DRY_RUN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-release-tag.py "$TAG"
          local_sha=$(git rev-parse "$TAG^{commit}")
          test "$local_sha" = "$SHA"

          remote_sha=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | awk 'NR == 1 { print $1 }')
          if [[ -z "$remote_sha" ]]; then
            remote_sha=$(git ls-remote --tags origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')
          fi
          test "$remote_sha" = "$SHA"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; immutable releases cannot be replaced" >&2
            exit 1
          fi

          find dist -type f -print -exec sha256sum {} \;
          if [[ "$DRY_RUN" == true ]]; then
            echo "dry run: validated $TAG at $SHA without creating a release"
            exit 0
          fi

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --verify-tag \
            --title "Simi $TAG" \
            --latest=false \
            --notes "Simi prerelease $TAG built from immutable Git commit $SHA."
