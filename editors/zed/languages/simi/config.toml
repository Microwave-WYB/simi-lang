name = "Simi"
grammar = "simi"
path_suffixes = ["simi"]
line_comments = ["-- "]
tab_size = 4
hard_tabs = false
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]

# These patterns are recovery-only while a construct is incomplete; sibling arm
# alignment is owned by the grammar-backed regions in indents.scm. Line regexes
# cannot model sibling arm alignment.
increase_indent_pattern = "^(?!\\s*--)(?:.*\\b(do|then|else)\\s*|\\s*(?:case\\b.*\\bof|catch\\b|fn\\b(?!.*\\bend\\s*(?:--.*)?$).*|(?!.*--.*=>).*=>)\\s*)(--.*)?$"
decrease_indent_pattern = "^\\s*(elseif|else|catch|end)\\b"
